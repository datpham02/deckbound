name: Headless Tests and Smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  headless-tests-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: firebelley/setup-godot@v1
        with:
          version: 4.6.3

      - name: Resolve Godot binary
        shell: bash
        run: |
          if command -v godot >/dev/null 2>&1; then
            echo "GODOT_BIN=godot" >> "$GITHUB_ENV"
          elif command -v godot4 >/dev/null 2>&1; then
            echo "GODOT_BIN=godot4" >> "$GITHUB_ENV"
          else
            echo "Godot binary not found after setup." >&2
            exit 1
          fi

      - name: Run headless tests
        run: bash ./tests/run_headless_tests.sh

      - name: Run headless smoke check
        run: $GODOT_BIN --headless --path . --quit
