<svg xmlns="http://www.w3.org/2000/svg" width="240" height="360" viewBox="0 0 240 360">
  <!-- Compact card frame (in hand). Layout zones only, no text: cost circle top-left, name band, Play zone, divider, Bind zone with bind-loop icon. Interior is paper; illustration sits behind text at reduced contrast. -->
  <rect x="4" y="4" width="232" height="352" rx="14" fill="#E6DCC3" stroke="#1A1426" stroke-width="6"/>
  <rect x="14" y="14" width="212" height="332" rx="8" fill="none" stroke="#6B7780" stroke-width="3"/>
  <circle cx="40" cy="40" r="22" fill="#1A1426"/>
  <rect x="68" y="22" width="150" height="36" rx="4" fill="#1A1426" fill-opacity="0.12"/>
  <!-- Play zone (copper marker) -->
  <rect x="22" y="76" width="196" height="100" rx="4" fill="#1A1426" fill-opacity="0.06"/>
  <path d="M30 96 L44 84 L58 96 L44 108 Z" fill="#D9783A"/>
  <!-- divider -->
  <line x1="22" y1="190" x2="218" y2="190" stroke="#1A1426" stroke-width="4"/>
  <!-- Bind zone (blue-teal closed loop marker) -->
  <rect x="22" y="204" width="196" height="100" rx="4" fill="#1A1426" fill-opacity="0.06"/>
  <circle cx="44" cy="228" r="12" fill="none" stroke="#4FA3B8" stroke-width="6"/>
  <!-- bottom margin above gesture bar -->
</svg>
