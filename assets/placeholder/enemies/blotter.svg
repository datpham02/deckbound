<svg xmlns="http://www.w3.org/2000/svg" width="300" height="270" viewBox="0 0 300 270">
  <!-- Blotter placeholder: faces left. Squat, slumped under wet paper, stamp-shaped fist, ink pool. Lowest and roundest. -->
  <!-- ink pool -->
  <ellipse cx="150" cy="248" rx="135" ry="18" fill="#1A1426"/>
  <!-- slumped body under wet paper sheet -->
  <path d="M40 245 Q30 140 100 110 Q170 85 230 130 Q275 180 260 245 Z" fill="#E6DCC3" stroke="#1A1426" stroke-width="6" stroke-linejoin="round"/>
  <path d="M70 200 Q100 150 150 160 Q190 170 210 220" fill="none" stroke="#6B7780" stroke-width="5"/>
  <path d="M120 125 Q140 100 175 112" fill="none" stroke="#1A1426" stroke-width="5"/>
  <!-- ink blots on paper -->
  <circle cx="190" cy="150" r="14" fill="#1A1426"/>
  <circle cx="95" cy="215" r="10" fill="#1A1426"/>
  <!-- face gap -->
  <ellipse cx="82" cy="150" rx="20" ry="14" fill="#1B2026" stroke="#1A1426" stroke-width="5"/>
  <circle cx="76" cy="148" r="5" fill="#E8A33D"/>
  <!-- arm ending in flat stamp-fist, left -->
  <path d="M70 190 Q35 205 30 225" fill="none" stroke="#1A1426" stroke-width="22" stroke-linecap="round"/>
  <rect x="6" y="208" width="46" height="38" rx="4" fill="#8C2F2B" stroke="#1A1426" stroke-width="6"/>
  <!-- dripping hem -->
  <path d="M120 245 L120 262 M170 245 L170 266 M215 245 L215 258" stroke="#1A1426" stroke-width="7" stroke-linecap="round"/>
</svg>
